[package]
name = "plasticine-img2bez-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
img2bez = { git = "https://github.com/fontgarden/img2bez", rev = "278aa3683f1e7243158c82b1bdcdafec6436cfc6", default-features = false, features = ["render"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
